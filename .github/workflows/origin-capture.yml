name: Origin capture (official NFL pages)

# Fetches official NFL.com week schedule pages from a GitHub-hosted runner
# (full internet) and commits the verified results feed to the working branch
# so the authoring sandbox (which cannot reach nfl.com) can build the
# origination module from it. Pattern proven by the desk-capture workflow.
# Never touches `main`. Trigger file is origin/capture-request.txt so the job
# cannot loop on its own commits.

on:
  push:
    branches: [ arena/f2df8317-x3 ]
    paths: [ origin/capture-request.txt ]
  workflow_dispatch:
    inputs:
      phase:
        description: "results = fetch official pages; close = cycle-close snapshot marker"
        required: false
        default: results
        type: string

permissions:
  contents: write

concurrency:
  group: origin-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Capture official pages (results feed)
        if: ${{ inputs.phase != 'close' }}
        run: |
          python3 scripts/origin_capture.py results 2>&1 | tee capture_log.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Cycle-close snapshot marker
        if: ${{ inputs.phase == 'close' }}
        run: python3 scripts/origin_capture.py close

      - name: Commit captured data
        if: always()
        run: |
          git config user.name "origin-capture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f origin/data capture_log.txt 2>/dev/null || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "chore(origin): capture verified results feed from official pages (run $GITHUB_RUN_ID)"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
