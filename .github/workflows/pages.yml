name: Deploy X3 NFL site to GitHub Pages

on:
  push:
    branches: [ arena/3bf7cc8b-x3, main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check site files and internal links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          pages = sorted(Path('.').glob('*.html')) + sorted(Path('pages').glob('*.html')) + sorted(Path('site').glob('*.html')) + sorted(Path('lab').glob('*.html'))
          assert pages, 'No HTML pages found'
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      href = dict(attrs).get('href', '')
                      if href: self.hrefs.append(href)
          failures = []
          roots = [Path('.'), Path('pages'), Path('site'), Path('lab')]
          for page in pages:
              parser = Links(); parser.feed(page.read_text())
              for href in parser.hrefs:
                  if href.startswith(('http://', 'https://', '#', 'mailto:')): continue
                  target = href.split('#', 1)[0]
                  if not target: continue
                  found = any((root / target).resolve() == (page.parent / target).resolve() for root in roots)
                  found = found or (page.parent / target).exists()
                  if not found:
                      # allow cross-folder references that exist anywhere under a root
                      if not any(list(root.rglob(target)) for root in roots if root.exists()):
                          failures.append(f'{page}: {href}')
          if failures:
              raise SystemExit('Broken internal links:\n' + '\n'.join(failures))
          print(f'Validated {len(pages)} HTML pages and their local links.')
          PY

      - name: Check dashboard site (docs/) rows have sources and no broken links
        run: python3 scripts/check_site.py

      - name: Check other integrated root pages
        run: python3 tools/check_links.py

      - name: Repo-wide audit — every module, links + source rows (audit_all)
        run: python3 scripts/audit_all.py

      - name: Check docs/pages research tree (verify_site)
        run: python3 tools/verify_site.py

      - name: Check x3lab data wiring (verify_data)
        run: python3 scripts/verify_data.py

      - name: Check the consolidated review hub
        run: python3 scripts/check_hub.py

      - name: Repo-wide integration audit (verify_integration)
        run: python3 scripts/verify_integration.py

      - name: Verify the consolidated decision desk
        run: python3 scripts/desk_verify.py

      - name: Check source-first decision dashboard
        run: |
          python3 scripts/check_dashboard.py
          node --check assets/data.js
          node --check assets/app.js
          node --check scripts/check_data.js
          node --check scripts/check_render.js
          node scripts/check_data.js
          node scripts/check_render.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
