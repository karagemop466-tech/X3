name: probe

on:
  push:
    branches:
      - arena/64164906-x3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/64164906-x3
      - name: Probe official sources
        run: |
          set -x
          mkdir -p data/raw
          for u in \
            "https://www.nfl.com/injuries/" \
            "https://www.nfl.com/standings/league/2026/REG" \
            "https://www.nfl.com/schedules/2026/REG1/" \
            "https://www.nfl.com/stats/player-stats/category/passing/2026/reg/all/passingyards/desc" ; do
            name=$(echo "$u" | sed 's#https://##; s#[/?=&]#_#g')
            code=$(curl -s -o "data/raw/probe_${name}.html" -w "%{http_code}" -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36" "$u")
            echo "$u -> $code $(wc -c < "data/raw/probe_${name}.html") bytes" >> data/raw/probe_status.txt
          done
          cat data/raw/probe_status.txt
      - name: Commit probe output
        run: |
          git config user.name "ci-probe"
          git config user.email "ci-probe@users.noreply.github.com"
          git add data/raw || true
          git commit -m "ci: probe official source reachability" || echo "nothing to commit"
          git push origin HEAD:arena/64164906-x3 || echo "push failed"
