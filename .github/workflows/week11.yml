# Week-11 Wednesday watch (session arena/40cd3b17-x3, M2).
# Fails loudly when today's committed reads drift from the audit, the build is
# stale, or a capture hash changes - the same fail-loud rule the drift-alarm
# requirement (B62) pins on every scraper.
name: Week11 watch

on:
  push:
    paths:
      - 'week11/**'
      - 'data/week11/**'
      - 'scripts/week11_audit.py'
      - 'scripts/week11_build.py'
      - 'scripts/week11_verify.py'
      - '.github/workflows/week11.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Freshness audit + build + gate
        run: |
          python3 scripts/week11_audit.py
          python3 scripts/week11_build.py
          python3 scripts/week11_verify.py
