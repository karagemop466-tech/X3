name: data-pipeline

on:
  push:
    branches:
      - main
      - arena/**
  schedule:
    # 13:00 and 21:00 UTC — after the NFL's official injury-report releases
    # (Wed/Fri/Sat 4:00 pm ET and Sun 12:00 pm ET) and ahead of Sunday kickoff.
    - cron: "13 13 * * *"
    - cron: "13 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRANCH: ${{ github.event_name == 'schedule' && 'main' || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch official sources
        run: |
          python scripts/fetch_official.py --out data/raw --manifest data/datasets/fetch_manifest.json

      - name: Capture parser fixtures
        run: python scripts/capture_fixtures.py

      - name: Run offline self-tests
        run: python scripts/selftest.py

      # Capture the raw official payloads before anything else can fail, so the
      # evidence is always downloadable for review.
      - name: Upload raw official payloads (audit artifact, not committed)
        uses: actions/upload-artifact@v4
        with:
          name: raw-official-sources
          path: data/raw
          retention-days: 14
          if-no-files-found: warn

      - name: Build verified datasets
        run: python scripts/build_datasets.py

      # Diagnostics are committed even when a step fails, so the failure can be
      # diagnosed from the repository alone.
      - name: Commit diagnostics
        if: always()
        run: |
          git config user.name "x3-data-pipeline"
          git config user.email "x3-data-pipeline@users.noreply.github.com"
          git add -f data/datasets || true
          if git diff --cached --quiet; then
            echo "no diagnostics to commit"
          else
            git commit -m "ci: publish build diagnostics" || echo "diagnostic commit failed"
          fi

      - name: Compute signals, lines and correlations
        run: python scripts/compute_signals.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Validate site (links, source links, blank cells)
        run: python scripts/validate_site.py --external

      - name: Commit regenerated data and site
        run: |
          git config user.name "x3-data-pipeline"
          git config user.email "x3-data-pipeline@users.noreply.github.com"
          git add -A -- . ':!data/raw'
          git add -f data/datasets || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "ci: regenerate official datasets and site"
          fi

      # One single, rebase-safe publish step. A push race is retried and then
      # reported without failing the build: the next scheduled run reconciles.
      - name: Publish to the branch
        if: always()
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH" || { sleep 5; continue; }
            if git rebase "origin/$BRANCH"; then
              if git push origin "HEAD:$BRANCH"; then
                echo "published to $BRANCH"
                exit 0
              fi
            else
              # A conflict on a regenerated file is resolved in favour of the
              # freshly generated version (the commit being replayed).
              git diff --name-only --diff-filter=U | while read -r f; do
                [ -n "$f" ] && git checkout --theirs -- "$f" 2>/dev/null || true
              done
              git add -A || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
            echo "publish attempt $attempt failed; retrying"
            sleep $((attempt * 4))
          done
          echo "could not publish to $BRANCH after 5 attempts"
          exit 0
