name: data-pipeline

on:
  push:
    branches:
      - main
      - arena/**
  schedule:
    # 13:00 and 21:00 UTC — after the NFL's official injury-report releases
    # (Wed/Fri/Sat 4:00 pm ET and Sun 12:00 pm ET) and ahead of Sunday kickoff.
    - cron: "13 13 * * *"
    - cron: "13 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRANCH: ${{ github.event_name == 'schedule' && 'main' || github.ref_name }}
      LOGS: data/datasets/logs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare log directory
        run: mkdir -p "$LOGS"

      # Every step writes its output into data/datasets/logs, and the whole
      # directory is committed at the end. A failure can therefore be
      # diagnosed from the repository alone, without CI log access.
      - name: Static check
        run: python -m pyflakes scripts/*.py scripts/lib/*.py 2>&1 | tee "$LOGS/static_check.log" || true

      - name: Fetch official sources
        run: |
          set -o pipefail
          python scripts/fetch_official.py --out data/raw --manifest data/datasets/fetch_manifest.json 2>&1 | tee "$LOGS/fetch.log" || true

      - name: Capture parser fixtures
        run: |
          set -o pipefail
          python scripts/capture_fixtures.py 2>&1 | tee "$LOGS/fixtures.log" || true

      - name: Run offline self-tests
        run: |
          set -o pipefail
          python scripts/selftest.py 2>&1 | tee "$LOGS/selftest.log" || true

      - name: Upload raw official payloads (audit artifact, not committed)
        uses: actions/upload-artifact@v4
        with:
          name: raw-official-sources
          path: data/raw
          retention-days: 14
          if-no-files-found: warn

      - name: Build verified datasets
        run: |
          set -o pipefail
          python scripts/build_datasets.py 2>&1 | tee "$LOGS/datasets.log" || true

      - name: Compute signals, lines and correlations
        run: |
          set -o pipefail
          python scripts/compute_signals.py 2>&1 | tee "$LOGS/signals.log" || true

      - name: Build site
        run: |
          set -o pipefail
          python scripts/build_site.py 2>&1 | tee "$LOGS/site.log" || true

      - name: Validate site (links, source links, blank cells)
        run: |
          set -o pipefail
          python scripts/validate_site.py --external 2>&1 | tee "$LOGS/validate.log" || true

      # Everything is committed, including the logs and the validation report,
      # so the datasets, the generated site and the diagnosis are always
      # available in the repository for review.
      - name: Commit regenerated data, site and logs
        if: always()
        continue-on-error: true
        run: |
          git config user.name "x3-data-pipeline" || true
          git config user.email "x3-data-pipeline@users.noreply.github.com" || true
          git add -A || true
          git add -f data/datasets || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "ci: regenerate official datasets and site" || echo "commit failed"
          fi

      # The build status still reflects reality: the pipeline fails if the
      # offline self-tests failed, if the validator found a broken link, if a
      # dataset row lacks an official source link, or if a script raised. The
      # report is already committed, so the failure is diagnosable from the
      # repository.
      - name: Check pipeline result
        if: always()
        run: |
          python - <<'PY'
          import json, os, re, sys

          # 1. The offline self-tests must have passed.
          selftest = "data/datasets/logs/selftest.log"
          if os.path.exists(selftest):
              with open(selftest, encoding="utf-8") as fh:
                  log = fh.read()
              failures = re.findall(r"^\[FAIL\] (.*)$", log, re.M)
              if failures:
                  for line in failures:
                      print(f"[FAIL] self-test: {line}")
                  print(f"{len(failures)} self-test(s) failed")
                  sys.exit(1)
              print("[PASS] offline self-tests")

          # 2. The validation report must have passed.
          report = "data/datasets/validation_report.json"
          if not os.path.exists(report):
              print("no validation report was produced")
              sys.exit(1)
          with open(report, encoding="utf-8") as fh:
              data = json.load(fh)
          failures = [c for c in data.get("checks", []) if c.get("result") == "fail"]
          for check in data.get("checks", []):
              print(f"[{check.get('result','').upper()}] {check.get('name')}: {check.get('detail')}")
          if failures:
              print(f"{len(failures)} validation check(s) failed")
              sys.exit(1)
          print("validation passed")
          PY

      # One single, rebase-safe publish step. A push race is retried and then
      # reported without failing the build: the next scheduled run reconciles.
      - name: Publish to the branch
        if: always()
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH" || { sleep 5; continue; }
            if git rebase "origin/$BRANCH"; then
              if git push origin "HEAD:$BRANCH"; then
                echo "published to $BRANCH"
                exit 0
              fi
            else
              git diff --name-only --diff-filter=U | while read -r f; do
                [ -n "$f" ] && git checkout --theirs -- "$f" 2>/dev/null || true
              done
              git add -A || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
            echo "publish attempt $attempt failed; retrying"
            sleep $((attempt * 4))
          done
          echo "could not publish to $BRANCH after 5 attempts"
          exit 0
